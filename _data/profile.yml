short_bio: >-
  <p style="margin-bottom: 5px;">
    Greetings! I am now a Ph.D. student in <a href="https://ieda.ust.hk/eng/index.php" target="_blank">Industrail Engineering & Decision Analytics</a> department at <a href="https://hkust.edu.hk/" target="_blank">The Hong Kong University of Science and Technology (HKUST)</a>, under the supervison of <a href="https://www.ieda.ust.hk/dfaculty/tsung/" target="_blank">Prof. Fugee Tsung</a> and <a href="https://cartus.github.io/" target="_blank">Prof. Zhijiang Guo</a>. I previously obtained my M.phil. degree in Data Science & Analytics at <a href="https://www.hkust-gz.edu.cn/zh/" target="_blank">HKUST(GZ)</a>, under the supervision of <a href="https://yuxuanliang.com/" target="_blank">Prof. Yuxuan Liang</a> and <a href="https://sites.google.com/ucsc.edu/jiahengwei" target="_blank">Prof. Jiaheng Wei</a>. I previously obtained my B.S. degree in Data Science & Big Data Technology from <a href="https://www.tju.edu.cn/" target="_blank">Tianjin University</a> in 2024, under the supervision of <a href="https://cam.tju.edu.cn/homepage/wuhuaming/" target="_blank">Prof. Huaming Wu</a>.  
  </p>
  <p style="margin-bottom: 5px;">
    Based on the computing resources from <a href="https://www.bristol.ac.uk/research/centres/bristol-supercomputing/articles/2025/isambard-ai-launches-july-2025.html" target="_blank">Bristol Centre for Supercomputing</a>, I am currently focusing on Agentic RL Infra researches, collaborated with <a href="https://yinhongliu.com/" target="_blank">Dr. Yinhong Liu</a> from the <a href="https://www.cam.ac.uk/" target="_blank">University of Cambridge</a> and <a href="https://imjiawen.com/" target="_blank">Dr. Jiawen Zhang</a> from <a href="https://www.microsoft.com/en-us/research/group/microsoft-research-asia-singapore/" target="_blank">MSRA-Singapore</a>. I am also fortunate to receive guidance from <a href="http://www.sjruan.me/" target="_blank">Prof. Sijie Ruan</a> at the <a href="https://www.bit.edu.cn/" target="_blank">Beijing Institude of Technology</a>, <a href="https://liyexn.github.io/" target="_blank">Prof. Yexin Li</a> at <a href="https://www.bigai.ai/" target="_blank">BIGAI</a>, and <a href="https://sg.linkedin.com/in/kun-ouyang-277753a4" target="_blank">Dr. Kun Ouyang</a> at <a href="https://guangzi.qq.com/" target="_blank">LIGHTSPEED STUDIOS</a>, <a href="https://www.tencent.com/zh-cn/index.html" target="_blank">Tencent</a>.
  </p>
  <p style="margin-bottom: 5px;">
    My research interests lie in Agentic RL, Data Mining, and Crowdsourcing. I welcome collaborations with researhers and practitioners in related areas!
  </p>

